name: Import paper PDFs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-paper-pdfs.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download official PDFs
        run: |
          curl -L --fail --retry 3 -o papers/latent-humanoid-tennis/paper.pdf \
            https://zzk273.github.io/LATENT/static/scripts/Humanoid_Tennis.pdf
          curl -L --fail --retry 3 -o papers/adapt-professional-tennis/paper.pdf \
            https://humanoidtennis.github.io/AdaPT/static/docs/AdaPT_Arxiv.pdf

      - name: Verify downloaded files
        run: |
          echo "e2adf6225f8717fa971e1a7d40f0d19e2e97d57bae23b2f2f22ab8fffbda94b5  papers/latent-humanoid-tennis/paper.pdf" | sha256sum --check
          echo "aae61d570788a29bd78cb35411faa44abd8762da7ed4bdb9b7d0aa448b85a472  papers/adapt-professional-tennis/paper.pdf" | sha256sum --check
          test "$(head -c 5 papers/latent-humanoid-tennis/paper.pdf)" = "%PDF-"
          test "$(head -c 5 papers/adapt-professional-tennis/paper.pdf)" = "%PDF-"

      - name: Commit PDFs and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/latent-humanoid-tennis/paper.pdf papers/adapt-professional-tennis/paper.pdf
          git rm .github/workflows/import-paper-pdfs.yml
          git commit -m "Add official tennis paper PDFs"
          git push
